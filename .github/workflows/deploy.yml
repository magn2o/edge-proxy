name: Deploy Proxy Configs to All Nodes

on:
  push:
    branches:
      - test-pipeline

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install cloudflared
        run: |
          curl -L https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-archive-keyring.gpg] https://pkg.cloudflare.com/cloudflared $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update && sudo apt-get install cloudflared

      - name: Compile Configuration Templates
        env:
          NGINX_VERSION: "1.30"
          CERTBOT_VERSION: "v3.1.0"
          HOME_SERVER_IP: ${{ secrets.HOME_SERVER_IP }}
          PROXY_DOMAIN: ${{ secrets.PROXY_DOMAIN }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          # 1. Setup nested staging folders
          mkdir -p output/conf.d
          mkdir -p output/certbot
          mkdir -p output/config
          
          # 2. Compile active template files
          envsubst '$CERTBOT_VERSION' < config/Dockerfile.template > output/config/Dockerfile
          envsubst '$NGINX_VERSION,$PROXY_DOMAIN' < config/compose.yaml.template > output/compose.yaml
          envsubst '$BUNNY_API_KEY' < config/bunny.ini.template > output/certbot/bunny.ini
          envsubst '$PROXY_DOMAIN,$HOME_SERVER_IP' < config/plex.conf.template > output/conf.d/plex.conf
          
          # 3. Copy static files into matching path layouts
          cp config/nginx.conf output/nginx.conf

      - name: Loop and Deploy to Nodes
        env:
          RAW_HOSTS: ${{ vars.SSH_HOSTS }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Dynamically mask the host variable values so they never leak in the action logs
          echo "::add-mask::$RAW_HOSTS"
          
          # Convert comma-separated string from vars.SSH_HOSTS into a bash array
          IFS=',' read -r -a HOST_ARRAY <<< "$RAW_HOSTS"
          
          for node_host in "${HOST_ARRAY[@]}"; do
            # Trim any accidental whitespace
            node_host=$(echo "$node_host" | xargs)
            if [ -z "$node_host" ]; then continue; fi
            
            # Mask the individual host string just to be absolutely sure
            echo "::add-mask::$node_host"
            echo "--- Deploying to Node: ${node_host} ---"
            
            # Setup ephemeral SSH workspace on the runner
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H "$node_host" >> ~/.ssh/known_hosts 2>/dev/null

            # Set permissions locally BEFORE sending so you don't need a separate chmod command
            chmod 600 output/certbot/bunny.ini 2>/dev/null || true

            tar -czf - -C output . | ssh -o ProxyCommand="cloudflared access ssh --hostname %h" -i ~/.ssh/id_ed25519 "${SSH_USER}@${node_host}" "
                mkdir -p /opt/edge-proxy/certbot /opt/edge-proxy/conf.d && \
                tar -xzf - -C /opt/edge-proxy/ && \
                cd /opt/edge-proxy && \
                docker compose up -d --force-recreate"
                        
            echo "--- Finished Node: ${node_host} ---"
          done